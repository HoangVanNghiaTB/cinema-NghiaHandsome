services:
  - type: web
    name: cinema-3d
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Voice qua mạng khó nối (4G, mạng công ty) cần TURN. Điền 3 biến này trên Render dashboard:
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
